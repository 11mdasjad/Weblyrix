<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weblyrix Digital Solutions | Employee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f7ff;
            --text-primary: #1f2937;
            --text-secondary: #5b6675;
            --accent-primary: #6366f1;
            --accent-secondary: #4f46e5;
            --gradient-primary: linear-gradient(135deg, #4f46e5 0%, #6366f1 50%, #818cf8 100%);
            --glass-bg: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(55, 65, 141, 0.14);
            --shadow-soft: 0 14px 40px rgba(99, 102, 241, 0.14);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Sora', sans-serif;
            background: linear-gradient(180deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .topbar {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 20;
        }

        .topbar-inner {
            max-width: 1180px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo img {
            height: 72px;
            width: auto;
            display: block;
        }

        .nav-link {
            text-decoration: none;
            color: var(--accent-primary);
            font-weight: 600;
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 999px;
            padding: 0.6rem 1rem;
            transition: 0.25s ease;
        }

        .nav-link:hover {
            background: rgba(99, 102, 241, 0.08);
            transform: translateY(-2px);
        }

        .employee-page {
            max-width: 1180px;
            margin: 0 auto;
            padding: 4rem 1.5rem 5rem;
        }

        .heading {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .heading h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.8rem, 4vw, 3rem);
            line-height: 1.2;
            margin-bottom: 0.7rem;
        }

        .heading p {
            color: var(--text-secondary);
            max-width: 650px;
            margin: 0 auto;
        }

        .employee-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .employee-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            padding: 1.5rem;
            box-shadow: var(--shadow-soft);
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .employee-card::before {
            content: "";
            position: absolute;
            inset: -120px auto auto -90px;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(129, 140, 248, 0.2) 0%, transparent 70%);
            pointer-events: none;
        }

        .employee-card:hover {
            transform: translateY(-8px) rotateX(2deg) rotateY(-2deg);
            box-shadow: 0 22px 45px rgba(99, 102, 241, 0.2);
        }

        .avatar {
            width: 74px;
            height: 74px;
            border-radius: 18px;
            background: var(--gradient-primary);
            display: grid;
            place-items: center;
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }

        .employee-name {
            font-size: 1.4rem;
            margin-bottom: 0.35rem;
        }

        .employee-qualification {
            color: var(--accent-primary);
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            border-radius: 999px;
            padding: 0.35rem 0.8rem;
            background: rgba(99, 102, 241, 0.1);
            color: var(--accent-primary);
            font-size: 0.83rem;
            font-weight: 600;
        }

        .tag-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #6366f1;
            box-shadow: 0 0 0 5px rgba(99, 102, 241, 0.2);
        }

        @media (max-width: 768px) {
            .logo img {
                height: 58px;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="logo" href="index.html">
                <img src="./assets/weblyrix_logo_full.svg" alt="Weblyrix Digital Solutions logo">
            </a>
            <a class="nav-link" href="index.html">Back to Home</a>
        </div>
    </header>

    <main class="employee-page">
        <section class="heading">
            <h1>Our Employee</h1>
            <p>Meet the professionals building premium digital experiences at Weblyrix Digital Solutions.</p>
        </section>

        <section class="employee-grid">
            <article class="employee-card">
                <div class="avatar">KS</div>
                <h2 class="employee-name">Khalid Saifullah</h2>
                <p class="employee-qualification">(BBA)</p>
                <span class="tag">
                    <span class="tag-dot"></span>
                    Active Team Member
                </span>
            </article>

            <article class="employee-card">
                <div class="avatar">MS</div>
                <h2 class="employee-name">M Shadaab Akhtar</h2>
                <p class="employee-qualification">(Architecture)</p>
                <span class="tag">
                    <span class="tag-dot"></span>
                    4 Years Experience
                </span>
            </article>
        </section>
    </main>
</body>
</html>
